name: Local release instructions

# Releases are built and notarised on the maintainer's Mac, then uploaded.
# Tag pushes deliberately do not start a second build on GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Show the local release process
        run: |
          echo 'Build on your Mac: npm run release:build'
          echo 'Notarise: npm run release:notarise -- /path/to/build tidy-notary'
          echo 'Upload the verified DMG to a GitHub draft release, then publish it.'
          echo 'See docs/RELEASING.md for the one-time Keychain setup and checks.'
