# Cargo workspace: shared core (tidy-core) + the Tauri app (src-tauri) +
# the MCP sidecar (crates/mcp). Shared crates are pinned here so the app and the
# sidecar link the *same* rusqlite/serde — their APIs exchange those types.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/mcp"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
log = "0.4"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "sync", "process", "time"] }
futures-util = "0.3"
tidy-core = { path = "crates/core" }

# Proc macros and build scripts run on this Mac while compiling and never
# ship, so they are left unstripped. Xcode 27's strip damages the metadata a
# proc-macro library carries, and release builds then fail with "can't find
# crate". The app itself is still stripped.
[profile.release.build-override]
strip = false
